<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi Link</title>
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#14213d; --muted:#5b6785; --line:#d5dbe8;
  --accent:#2347e8; --accent-ink:#fff; --ok:#0f7b4f; --err:#b3261e; --code:#0f1830; --code-ink:#cfe0ff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1324; --card:#151d33; --ink:#e8edfb; --muted:#93a0c4; --line:#2a3556;
  --accent:#6f8cff; --accent-ink:#0b1226; --ok:#4cd694; --err:#ff8a80; --code:#0a0f1e; --code-ink:#bcd0ff;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:24px 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.step h2{font-size:1.05rem;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.step p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
label{display:block;font-size:.88rem;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);font:inherit}
textarea{min-height:76px;resize:vertical;word-break:break-all}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.out{margin-top:14px}
.status{font-size:.9rem;font-weight:600;margin-bottom:6px}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
pre{margin:0;background:var(--code);color:var(--code-ink);padding:12px;border-radius:9px;overflow:auto;font-size:.82rem;max-height:280px;white-space:pre-wrap;word-break:break-word}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Verifikasi Link</h1>
  <p class="sub">Kirim magic link ke email, lalu verifikasi dengan order ID kustom.</p>

  <section class="step">
    <h2><span class="n">1</span>Kirim link</h2>
    <p>Magic link akan dikirim ke email ini.</p>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="nama@email.com" autocomplete="email">
    <button id="btnSend">Kirim link</button>
    <div id="outSend" class="out hidden"></div>
  </section>

  <section class="step">
    <h2><span class="n">2</span>Verifikasi link</h2>
    <p>Tempel cookie dari langkah 1 dan URL magic link dari email.</p>
    <label for="email2">Email</label>
    <input id="email2" type="email" placeholder="nama@email.com">
    <label for="cookie">Cookie</label>
    <textarea id="cookie" placeholder="Terisi otomatis jika ditemukan di respons langkah 1"></textarea>
    <label for="magic">Magic link</label>
    <textarea id="magic" placeholder="https://..."></textarea>
    <label for="orderId">Custom order ID</label>
    <input id="orderId" value="Kenzie">
    <button id="btnVerify">Verifikasi link</button>
    <div id="outVerify" class="out hidden"></div>
  </section>
</main>

<script>
const BASE_URL = '/api'; // diproxy oleh server.js, jadi tidak kena CORS
const $ = id => document.getElementById(id);

async function post(endpoint, body) {
  try {
    const r = await fetch(`${BASE_URL}/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const text = await r.text();
    let data; try { data = JSON.parse(text); } catch { data = text; }
    return r.ok ? { ok: true, data } : { ok: false, error: data };
  } catch (e) {
    return { ok: false, error: 'Tidak bisa menghubungi server. Pastikan server.js berjalan.' };
  }
}

function show(el, res, okText) {
  el.classList.remove('hidden');
  el.innerHTML = '';
  const s = document.createElement('div');
  s.className = 'status ' + (res.ok ? 'ok' : 'err');
  s.textContent = res.ok ? okText : 'Gagal. Periksa isian lalu coba lagi.';
  const p = document.createElement('pre');
  const d = res.ok ? res.data : res.error;
  p.textContent = typeof d === 'string' ? d : JSON.stringify(d, null, 2);
  el.append(s, p);
}

function findCookie(o) {
  if (!o || typeof o !== 'object') return null;
  for (const k of Object.keys(o)) {
    if (/cookie/i.test(k) && typeof o[k] === 'string') return o[k];
    const deep = findCookie(o[k]);
    if (deep) return deep;
  }
  return null;
}

async function run(btn, fn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Memproses...';
  try { await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}

$('btnSend').onclick = () => run($('btnSend'), async () => {
  const email = $('email').value.trim();
  if (!email) return show($('outSend'), { ok: false, error: 'Email wajib diisi.' });
  const res = await post('send-link', { email });
  show($('outSend'), res, 'Link terkirim. Cek email Anda.');
  if (res.ok) {
    $('email2').value = email;
    const c = findCookie(res.data);
    if (c) $('cookie').value = c;
  }
});

$('btnVerify').onclick = () => run($('btnVerify'), async () => {
  const email = $('email2').value.trim(), cookie = $('cookie').value.trim(), magicLink = $('magic').value.trim();
  if (!email || !cookie || !magicLink)
    return show($('outVerify'), { ok: false, error: 'Email, cookie, dan magic link wajib diisi.' });
  const res = await post('verify-link', {
    email, cookie, magicLink, customOrderId: $('orderId').value.trim() || 'Kenzie'
  });
  show($('outVerify'), res, 'Verifikasi berhasil.');
});
</script>
</body>
</html>
